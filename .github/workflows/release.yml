name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual retry: if a tagged publish fails (e.g. npm token issues), fix the
  # secret and re-run this workflow against the same tag ref instead of
  # cutting a new release.
  workflow_dispatch:

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm --filter @clarxai/engine test

      # Engine first: the CLI bundles it and pnpm rewrites `workspace:*` to the
      # engine's version on publish. Publishing the CLI first could ship a CLI
      # pointing at an engine version that never made it to npm.
      - name: Publish @clarxai/engine
        run: pnpm --filter @clarxai/engine publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # No continue-on-error. It used to be set here, so a failed engine publish
      # left the release green while npm kept an older engine — which is how
      # engine 0.1.8 and CLI 0.1.10 came to be published out of step. A release
      # that only half-happened must fail loudly.
      - name: Publish @clarxai/cli
        run: pnpm --filter @clarxai/cli publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
